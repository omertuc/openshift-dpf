#   | TODO: "The docs do not set global.imagePullSecretName; add it to the docs if the OVN-Kubernetes DPU images need the DPF pull secret"
apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUServiceConfiguration
metadata:
  name: ovn
  namespace: dpf-operator-system
spec:
  deploymentServiceName: "ovn"
  serviceConfiguration:
    helmChart:
      values:
        global:
          enableOvnKubeIdentity: false
          imagePullSecretName: "dpf-pull-secret"
        k8sAPIServer: https://<HOST_CLUSTER_API>:6443
        podNetwork: 10.128.0.0/14/23
        serviceNetwork: 172.30.0.0/16
        hostNetworkNamespace: "openshift-host-network"
        mtu: <NODES_MTU>
        dpuManifests:
          kubernetesSecretName: "ovn-dpu"
          vtepCIDR: <VTEP_CIDR>
          hostCIDR: <DPU_HOST_CIDR>
          ipamPool: "pool1"
          ipamPoolType: "cidrpool"
          ipamVTEPIPIndex: 0
          ipamPFIPIndex: 1
          cniBinDir: "/var/lib/cni/bin/"
          cniConfDir: "/run/multus/cni/net.d"
