# @code-as-a-doc: file | param: "<*>"
#   | TODO: "HUMAN-REVIEW-029 - Flagged for human review priority 4, see .asadoc/human-review/04-HUMAN-REVIEW-029.md"
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: <WORKER_NAME>
  namespace: openshift-machine-api
spec:
  online: true
  bootMACAddress: <BOOT_MAC>
  rootDeviceHints:
    deviceName: <ROOT_DEVICE>
  bmc:
    address: redfish-virtualmedia+https://<BMC_IP>
    credentialsName: <WORKER_NAME>-bmc-secret
    disableCertificateVerification: true
  customDeploy:
    method: install_coreos
  userData:
    name: worker-user-data-managed
    namespace: openshift-machine-api
