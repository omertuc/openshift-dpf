# @code-as-a-doc: file
#   | TODO: "HUMAN-REVIEW-010 - Flagged for human review priority 8, see .asadoc/human-review/08-HUMAN-REVIEW-010.md"
#   | param: "<*>"
#   | remove-text: "# Create OperatorGroup\n(?s:.*?)---\n"
#   | TODO: "The code also creates an OperatorGroup in metallb-system, which the docs don't; the Subscription is in openshift-operators, so it looks unused: drop it from the code, or add it to the docs"
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
# Create OperatorGroup
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: metallb-operator
  namespace: metallb-system
spec:
  targetNamespaces:
  - metallb-system
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: metallb-operator
  namespace: openshift-operators
spec:
  channel: "stable"
  name: metallb-operator
  source: <CATALOG_SOURCE_NAME>
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  config:
    # Tolerate the taint on the master nodes
    tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    # Force scheduling only on nodes with the control-plane label
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
