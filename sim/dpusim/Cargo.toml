[package]
name = "dpusim"
version = "0.1.0"
edition = "2024"
description = "Tooling for simulated BlueField DPUs: VMs, wires, leaf, OVS setup and image builds"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
percent-encoding = "2.3.2"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
shlex = "2.0.1"
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false }
xmltree = { version = "0.12.0", features = ["attribute-order"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prose here is full of product names (BlueField, NetworkManager, ...), not code.
doc_markdown = "allow"
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
